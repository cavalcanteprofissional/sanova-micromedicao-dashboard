[tool.poetry]
name = "dashboard-sanova"
version = "1.0.0"
description = "Dashboard Streamlit — Análise Comercial de Micromedição (SANOVA)"
authors = ["SANOVA"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
streamlit = "^1.35.0"
pandas = "^2.0.0"
numpy = "^1.24.0"
plotly = "^5.18.0"
openpyxl = "^3.1.0"
huggingface_hub = ">=0.20.0"
python-dotenv = ">=1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
dashboard = "dashboard.main:main"